version: '3.9'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: fb-clinics-agent:latest
    container_name: fb-clinics-agent
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env                     # runtime 才注入 .env（不會包進 image）
    # log 上限：docker json-file 預設沒有上限，而本服務每個 request 都會把整包 response
    # （含 trace，indent=2）印出來（app/backend_agent_service.py 的 📤 那段），量很大。
    # 不設的話磁碟遲早被吃滿。10MB × 5 檔 = 最多 50MB，夠翻查最近的對話。
    # 注意：改這裡要 recreate 容器才生效（restart 不會套用），且舊 log 檔不會被回頭截斷。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # 向量索引存到容器外，重啟不必重跑 OpenAI embedding。
      # 每個 collection 一個目錄，三個都要掛（漏掉的那個每次啟動還是會重建）。
      # 新鮮度由 utils/index_cache.py 的來源指紋把關：data/*.csv 一改就自動重建，
      # 所以掛了 volume 也不會有舊索引上線的問題。
      - ./chroma_clinic_qa:/app/chroma_clinic_qa
      - ./chroma_treatment_qa:/app/chroma_treatment_qa
      - ./chroma_token_split:/app/chroma_token_split
      # BM25 的 pickle 刻意不掛：它只是 jieba 斷詞，沒有 API 呼叫，重建成本趨近於零，
      # 而 bind mount 單一檔案在 host 端檔案不存在時 Docker 會建成「目錄」，反而是坑。
      #
      # 如果之後想讓療程資料可獨立更新（不重 build），再把下面打開：
      # - ./data:/app/data
