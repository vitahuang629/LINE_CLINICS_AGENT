# ─────────────────────────────────────────────────────────────
# 回歸測試題庫（golden set）
#
# 每題 = 一個「客人問話 + 預期答對的特徵」。改完 code 跑 pytest，紅的就是回歸。
# ⚠️ 只放「AI 目前確實答對」的題（已用 replay 確認過），這樣才是有效基準。
#
# input:
#   content:          客人這一句（必填）
#   message_history:  之前的對話，由「舊到新」自然順序寫；客服句加 "[真人客服] " 前綴（選填）
#   ad_referral:      廣告來源關鍵字，只在 message_history 為空（首次對話）時對 AI 生效（選填）
#
# expect（只驗有寫的欄位）:
#   call_cs / handoff_reason / prices_present / prices_absent /
#   text_contains / text_contains_any / text_not_contains /
#   images_include_any / images_empty
# ─────────────────────────────────────────────────────────────

# 【1】SIS 問價 → 上下文在談 SIS，客人問「價格」要正確報 1888，且不可冒出別療程的價
- name: SIS_問價_報1888
  input:
    ad_referral: "SIS 科技深層精雕"
    message_history:
      - { type: human, content: "想了解「SIS 科技深層精雕」" }
      - { type: ai,    content: "[真人客服] 現在越來越多人選擇【被動式深層訓練】，強化核心、提升肌肉張力。簡單了解一下：目前年齡大約在？想針對哪方面改善？" }
      - { type: human, content: "32 肚子腰" }
      - { type: ai,    content: "[真人客服] 可以把 SIS 科技深層精雕當成你的「專屬智能教練」，運用聚焦超磁能 HIFEM 技術。之前有做過相關療程 或是實際諮詢檢測評估了解呢？" }
    content: "有做過療程沒有做過評估，價格"
  expect:
    call_cs: 0
    prices_present: [1888]
    # 9999 是「NEO + SIS 組合」的合法價（SIS 也在該組合裡），故不列入禁止；
    # 5999/8999(冷凍)、16800(EMFACE) 與 SIS 無關，仍不可出現。
    prices_absent: [5999, 8999, 16800]

# 【2】防捏價（EMFACE 版）：客人問「16800 之後的價格」，真人也沒報後續價
#      → AI 不可自己編後續價，也不可冒出別療程的價（5999/8999/9999/1888）。
#      （不驗「有沒有複述 16800」——AI 回「只能提供體驗價、後續請洽診所」也是正確行為，屬彈性回覆）
- name: EMFACE_問後續價_不可亂報價
  input:
    ad_referral: "EMFACE 菲斯波"
    message_history:
      - { type: human, content: "請問50歲做這個也有效果嗎？" }
      - { type: ai,    content: "[真人客服] 可以的，我們客戶也有 60-70 歲的唷。目前有想改善哪些臉部狀況呢？" }
      - { type: human, content: "沒有" }
      - { type: ai,    content: "[真人客服] ✨限時體驗價 $16,800✨ EMFACE 菲斯波（多層次拉提）＋PBM 紅光導入 x1＋修護面膜 x2。首次諮詢評估請預留約 1~2 小時。" }
    content: "體驗價16800，那之後價格多少？"
  expect:
    call_cs: 0
    prices_absent: [5999, 8999, 9999, 1888]

# 【3】防捏價：問「3次多少錢」，真人也沒報3次總價 → AI 不可自己乘出 17,997
- name: 冷凍_問3次總價_不可捏造
  input:
    ad_referral: "冷凍減脂"
    message_history:
      - { type: human, content: "想了解「小腹斷捨離5999」" }
      - { type: ai,    content: "[真人客服] 運用 -10°C 冷脈衝技術…目前想針對哪方面改善？" }
      - { type: human, content: "要幾次？" }
      - { type: ai,    content: "[真人客服] 一次能感覺…若脂肪較厚建議 2～3 次以上" }
    content: "3次要多少錢？"
  expect:
    call_cs: 0
    text_not_contains: ["17,997", "17997"]

